name: Elite Scanner

on:
  workflow_dispatch:  # bisa trigger manual dari cron-job.org via API
  # schedule:
  # - cron: '0 */4 * * *'  # fallback — tiap 4 jam (opsional)

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Restore cache (mode & last_update_id) ──────────────
      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: |
            mode.json
            last_update_id.json
          key: bot-state-v1  # ganti versi kalau mau reset state

      # ── Install dependencies ────────────────────────────────
      - name: Install dependencies
        run: pip install requests

      # ── Run bot ────────────────────────────────────────────
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python elite_scanner_bot.py

      # ── Save cache (update state terbaru) ──────────────────
      # Selalu save meski bot error, supaya last_update_id tidak hilang
      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            mode.json
            last_update_id.json
          key: bot-state-v1-${{ github.run_id }}  # key unik per run agar selalu tersimpan
